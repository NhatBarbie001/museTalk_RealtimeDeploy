# ==========================================
# Coturn STUN/TURN Server Configuration
# ==========================================

# Listening Port
listening-port=3478
tls-listening-port=5349

# Listening IP
listening-ip=0.0.0.0

# External IP (Replace with your IBM Cloud Public IP)
# external-ip=YOUR_IBM_PUBLIC_IP

# Relay ports for WebRTC media
min-port=10000
max-port=20000

# Authentication
lt-cred-mech
user=musetalk:secretpassword
realm=musetalk.local

# Security & Performance
no-cli
no-tls
no-dtls
fingerprint
verbose
